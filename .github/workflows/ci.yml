# OpenDesign CI — runs on every push and pull request.
# Everything here runs on a free GitHub Actions runner; no paid services, no secrets.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate, check manifest, test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18.x", "20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # jsdom is the only dependency, and it is dev-only.
      - name: Install dev dependencies
        run: npm ci

      - name: Repo health checks
        run: npm run validate

      - name: Manifest is not stale
        run: npm run check:manifest

      - name: Tests
        run: npm test

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No build output, secrets or lockfile drift committed
        run: |
          set -euo pipefail
          fail=0
          for bad in node_modules dist build .env .DS_Store; do
            if [ -e "$bad" ]; then echo "::error::$bad should not be committed"; fail=1; fi
          done
          # the gallery must stay dependency-free at runtime: no remote *resources*.
          # (plain <a href> links and og:/canonical metadata are fine)
          if grep -Eno '<(script|img|iframe|source)[^>]+src="https?://[^"]+"' index.html \
             || grep -Eno '<link[^>]+(stylesheet|preload|modulepreload)[^>]+href="https?://[^"]+"' index.html \
             || grep -Eno '@import[^;]*https?://' index.html; then
            echo "::error::index.html must not load third-party resources"
            fail=1
          fi
          exit "$fail"

      - name: Generated files are present
        run: |
          set -euo pipefail
          for f in manifest.json manifest.js index.html LICENSE README.md CONTRIBUTING.md; do
            test -s "$f" || { echo "::error::missing $f"; exit 1; }
          done
