name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Integridad del sitio estatico
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Existe punto de entrada HTML
        run: |
          test -f index.html || test -f public/index.html || test -f docs/index.html \
            || { echo "No hay index.html en raiz, public/ ni docs/"; exit 1; }
      - name: Todos los JSON parsean
        run: |
          fail=0
          while IFS= read -r f; do
            python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f" \
              || { echo "JSON invalido: $f"; fail=1; }
          done < <(find . -name '*.json' -not -path './.git/*' -not -path './node_modules/*')
          exit $fail
